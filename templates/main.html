<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pokemon Trading</title>
<link rel="shortcut icon" href="{{ url_for('static', filename='img/pokeball.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="game">
<div class="page">
  <div class="topbar"><h1>Welcome {{ name }}</h1></div>
  <nav class="actions">
    <a class="btn" href="/mine" id="mine">Mine</a>
    <a class="btn secondary" href="/node/chain">View Blockchain</a>
    <a class="btn secondary" href="/trade">Trade</a>
  </nav>
  <p class="stats">Block {{ chain_length }} &bull; {{ pending }} unconfirmed trades</p>
  <h2>Current Pokemon ({{ pokes|length }})</h2>
  {% if pokes %}
  <div class="grid">
    {% for k in pokes %}
    <div class="card">
      <img src="/static/img/pokemon/{{ k.id }}" alt="{{ k.name }}">
      <div class="name">{{ k.name }}</div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty"><p>No Pokemon currently owned. Mine blocks to capture Pokemon</p></div>
  {% endif %}
</div>
<script>
document.getElementById("mine").addEventListener("click", function () {
  this.textContent = "Mining\u2026";
});
</script>
</body>
</html>
