<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trade Pokemon</title>
<link rel="shortcut icon" href="{{ url_for('static', filename='img/pokeball.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="game">
<div class="page">
  <div class="topbar"><h1>{{ name }} &mdash; Trade Pokemon</h1></div>
  <nav class="actions">
    <a class="btn secondary" href="/home">Home</a>
    <a class="btn secondary" href="/trade/outg">View Trade Requests</a>
    <a class="btn secondary" href="/trade/off">View Trade Offers</a>
    <a class="btn secondary" href="/trade/unc">View Unconfirmed Trades</a>
  </nav>
  <h2>Choose Pokemon to trade</h2>
  {% if pokes %}
  <div class="grid">
    {% for k in pokes %}
    <a class="card" href="/trade/{{ k.num }}">
      <img src="/static/img/pokemon/{{ k.id }}" alt="{{ k.name }}">
      <div class="name">{{ k.name }}</div>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty"><p>No Pokemon currently owned. Mine blocks to capture Pokemon</p></div>
  {% endif %}
</div>
</body>
</html>
