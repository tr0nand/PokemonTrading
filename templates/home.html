<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pokemon Trading</title>
<link rel="shortcut icon" href="{{ url_for('static', filename='img/pokeball.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="start">
<div class="page">
  <div class="panel">
    <h1>Pokemon Trading</h1>
    <form method="post">
      <label for="username">Trainer name</label>
      <input id="username" name="user" type="text" placeholder="Enter name" autofocus>
      <div class="row">
        <button class="btn" type="submit">Start</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
