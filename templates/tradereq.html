<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trade {{ name }}</title>
<link rel="shortcut icon" href="{{ url_for('static', filename='img/pokeball.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="game">
<div class="page">
  <div class="topbar"><h1>Trade {{ name }}</h1></div>
  <nav class="actions">
    <a class="btn secondary" href="/home">Home</a>
    <a class="btn secondary" href="/trade/outg">View Trade Requests</a>
    <a class="btn secondary" href="/trade/off">View Trade Offers</a>
    <a class="btn secondary" href="/trade/unc">View Unconfirmed Trades</a>
  </nav>
  <h2>Choose Pokemon to receive</h2>
  {% if pokes %}
  <div class="grid">
    {% for k in pokes %}
    <div class="card">
      <form method="post" action="/trade/outg">
        <input type="hidden" name="node" value="{{ k.trainer }}">
        <input type="hidden" name="Sendpoke" value="{{ cur }}">
        <input type="hidden" name="Rec" value="{{ k.num }}">
        <button class="imgbtn" type="submit">
          <img src="/static/img/pokemon/{{ k.id }}" alt="{{ k.name }}">
        </button>
        <div class="name">{{ k.name }}</div>
        <div class="trainer">{{ k.trainer }}</div>
      </form>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty"><p>No Pokemon available from other trainers right now.</p></div>
  {% endif %}
</div>
</body>
</html>
